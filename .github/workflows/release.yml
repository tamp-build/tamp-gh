name: Release

# Dogfood release: this workflow builds AND publishes Tamp.GitHubCli.V2
# *using Tamp itself*. The dotnet-tamp global tool is installed and runs
# the Build.cs targets — same pattern Tamp's own self-hosted CI uses.

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:
    inputs:
      dry_run:
        description: 'If true, pack but do NOT push to nuget.org'
        type: boolean
        default: true

permissions:
  contents: read

env:
  DOTNET_NOLOGO: '1'
  DOTNET_CLI_TELEMETRY_OPTOUT: '1'
  DOTNET_SKIP_FIRST_TIME_EXPERIENCE: '1'
  TampCoreMode: package

jobs:
  publish:
    name: pack + push to nuget.org via Tamp
    runs-on: ubuntu-latest
    environment: release

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Install supported .NET SDKs
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: |
            8.0.x
            9.0.x
            10.0.x

      - name: Resolve version from tag
        if: github.event_name == 'push'
        run: echo "PACKAGE_VERSION=${GITHUB_REF_NAME#v}" >> "$GITHUB_ENV"

      - name: Install Tamp (the framework being dogfooded)
        run: dotnet tool install --global dotnet-tamp --version 1.0.0

      - name: tamp Ci
        run: dotnet tamp Ci

      - name: List packages
        run: ls -la ./artifacts/

      - name: tamp Push
        if: ${{ github.event_name == 'push' || inputs.dry_run == false }}
        env:
          NUGET_API_KEY: ${{ secrets.tmap_nuget_api_key }}
        run: dotnet tamp Push

      - name: Dry-run summary
        if: ${{ github.event_name == 'workflow_dispatch' && inputs.dry_run == true }}
        run: |
          echo "DRY RUN — would have pushed:"
          ls -la ./artifacts/*.nupkg
          echo ""
          echo "Re-run with dry_run=false to actually publish."

      - name: Upload packages as artifact
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: nupkgs
          path: ./artifacts/*.nupkg
          if-no-files-found: error
